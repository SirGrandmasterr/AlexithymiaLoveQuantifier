# Nginx is the only service with a published port, so it is the only door into the stack —
# which makes the limits set here the real limits, not advisory ones. That was not true while
# the backend was published on 8081 for anyone to route to directly.
#
# This file is included from the http block (conf.d/default.conf), so http-context directives
# belong at the top level here.

# Login and signup are the two endpoints where an attacker gets unlimited free attempts at
# someone's password. bcrypt at cost 14 already makes each one expensive — about a second of
# CPU — which is the other reason to bound them: fifty parallel guesses is also a way to take
# the backend down. 20/minute with a burst of 10 is far above what a person retrying a
# forgotten password does and far below what a script needs.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_status 429;

# `.mjs` is not in nginx's shipped mime.types (checked against nginx 1.31.4, 2026-08-31),
# so it is served as `application/octet-stream` — and a module script with that type is
# **refused** by strict MIME checking: *"Expected a JavaScript-or-Wasm module script but the
# server responded with a MIME type of application/octet-stream"*. ONNX Runtime's WASM
# loader is a `.mjs`, so without this line the Light-tier transcriber cannot start at all,
# and the error it reports is the unhelpful *"no available backend found"* (C3 measured
# both, in Chromium, against this stack).
#
# Multiple `types` blocks in one context accumulate, so this **adds** to the standard map
# the base image already included rather than replacing it. `.wasm` needs no line: nginx
# has mapped it to `application/wasm` since 1.21.
types {
    text/javascript  mjs;
}

server {
    listen 80;
    server_name alexithymialovequantifier.voglerprojekte.com api.alexithymialovequantifier.voglerprojekte.com localhost _;

    # Do not volunteer the version to anyone deciding which exploit to try.
    server_tokens off;

    # Avatars are the only upload. Gin's own default multipart cap is 32 MB, and the
    # handler sets no limit of its own, so this is what stops a stranger from streaming
    # gigabytes into the backend's /tmp.
    client_max_body_size 8m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Docker's embedded DNS, consulted per request rather than once at startup.
    #
    # `proxy_pass http://backend:8080` resolves the name when the config loads and caches
    # that address for the life of the process, so recreating the backend container — which
    # gives it a new IP — leaves Nginx proxying to an address nothing answers on, and every
    # /api call 502s until Nginx is restarted too. Going through a variable forces runtime
    # resolution. $request_uri carries the original path and query string, which is what the
    # literal form passed implicitly.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $upstream http://backend:8080;

    # `always` so they are present on error responses too, which is where a missing
    # X-Content-Type-Options tends to matter.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # microphone=(self), not microphone=(). Until Phase 6 the edge forbade the microphone
    # outright, which is a stronger statement than "the app does not use one": a
    # Permissions-Policy denial makes getUserMedia reject with NotAllowedError before the
    # browser ever asks the user, so the voice check-in could not even present its consent
    # prompt. (self) restores the *default* — the app's own origin may ask, an iframe may
    # not — and the user's answer to that prompt is still the thing that decides. geolocation
    # and camera stay denied: nothing in this product has any use for either.
    add_header Permissions-Policy "geolocation=(), microphone=(self), camera=()" always;

    # Cross-origin isolation, for the multithreaded WASM the on-device transcriber needs.
    #
    # SharedArrayBuffer — which is how a WASM build uses more than one core — is only handed
    # to a document that is cross-origin isolated, and a document is only cross-origin
    # isolated when it sends both of these. COOP severs the window from any opener in another
    # origin; COEP says every cross-origin subresource must opt in to being embedded here.
    #
    # COEP is the one with a blast radius. It applies to *every* subresource, so anything
    # this page loads from another origin now needs a Cross-Origin-Resource-Policy header of
    # its own or it is blocked outright — avatars under /uploads/ are exactly that whenever
    # the SPA and the API are served from different hostnames (the api.* subdomain in
    # production, a rebased absolute URL in the Android WebView). See the /uploads/ block.
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;

    # The built SPA loads one external script and one external stylesheet and nothing from
    # another origin (check dist/index.html — there are no inline scripts to allow for).
    # 'unsafe-inline' is needed for style-src only, for the handful of React style={{...}}
    # props; blob:/data: for the image preview before an avatar is uploaded.
    #
    # Two additions for Phase 6, and one deliberate non-addition:
    #
    #   'wasm-unsafe-eval' on script-src. A bare script-src 'self' blocks WebAssembly
    #   compilation entirely — WebAssembly.compile/instantiate are governed by the same
    #   directive that governs eval(), and they throw a CSP EvalError with no fallback path.
    #   'wasm-unsafe-eval' is the narrow grant that permits WASM and nothing else: unlike
    #   'unsafe-eval' it does not re-enable eval() or new Function() for JavaScript.
    #
    #   worker-src 'self', stated rather than inherited. It already resolved to 'self' by
    #   falling back through child-src to default-src, so this changes no behaviour today —
    #   it is written down because the transcriber runs in a Worker, and a directive a later
    #   session has to reason about should not be one it has to derive from a fallback chain.
    #
    #   connect-src is unchanged, deliberately. §5.6 of the phase design turns on it: model
    #   weights come from this origin (see /models/ below) and never from a public model hub,
    #   and the Vault page tells the user that every request goes to this app's own origin.
    #   Nothing in this phase may widen it.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.alexithymialovequantifier.voglerprojekte.com https://alexithymialovequantifier.voglerprojekte.com; font-src 'self'; connect-src 'self' https://api.alexithymialovequantifier.voglerprojekte.com https://alexithymialovequantifier.voglerprojekte.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Matches before the /api/ prefix block below — a regex location wins over a prefix one.
    #
    # `refresh` is here with the other two because it takes a credential from an unauthenticated
    # caller and answers with a live session: left in the generic /api/ block it would be the
    # one unmetered way to guess at one. 20r/m is far above what a real client needs — a token
    # is renewed roughly once a day, and only ever once per expiry.
    location ~ ^/api/(login|signup|refresh)$ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The Gemini relay, which is the one request in this app that waits on someone else's
    # machine. Everything else here answers out of Postgres in milliseconds, so the 60s read
    # timeout below is generous; a multimodal pass over half a minute of audio is not, and at
    # 60s Nginx would hand the user a 504 while the backend was still holding a good answer.
    # The exact-match location wins over the /api/ prefix, so only this endpoint waits longer.
    #
    # The body is a WAV as base64: ~1.3 MB for a full thirty-second take, well inside the 8 MB
    # server-level cap, which stays where it is.
    location = /api/journal/propose {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        # Longer than the backend's own 90s, so the timeout the user is told about is the
        # one the backend decided rather than a proxy cutting in first with a bare 504.
        proxy_read_timeout 120s;
    }

    location /api/ {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Previously absent, which is why avatars 404'd under Compose and the Android client was
    # pointed straight at the backend port instead. With this block the SPA and the app both
    # get their images through the proxy, and nothing needs a direct line to the backend.
    #
    # These files are user-supplied and the handler validates them by the Content-Type the
    # *client* declared (backend/internal/handlers/upload.go), so a file that is really HTML
    # can be stored and then served from this origin — stored XSS against the app's own
    # session. The headers below are the containment: `default-src 'none'` plus `sandbox`
    # means anything scriptable served from /uploads/ executes nothing and reaches nothing,
    # while an actual image still renders. add_header does not inherit into a location that
    # declares its own, so the server-level set is restated rather than extended.
    location /uploads/ {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; script-src 'none'; sandbox; frame-ancestors 'none'" always;

        # This one line is why the header change above is its own commit.
        #
        # Cross-Origin-Embedder-Policy: require-corp on the app document means every
        # cross-origin subresource must say it consents to being embedded. Without CORP the
        # image is blocked by the embedder policy and the <img> breaks with no HTTP error to
        # read — the same class of silent failure the /uploads/ block itself was added to fix.
        #
        # Be precise about when that actually bites, because it is easy to test the wrong
        # thing (C1 did, first time round). By default the web build resolves avatars as
        # same-origin relative paths — getServerUrl() returns '' — and COEP never applies to
        # them, so an avatar loading on a stock deployment says nothing about this header.
        # It is load-bearing when the SPA served *by this Nginx* fetches avatars from another
        # origin, which happens whenever getServerUrl() is non-empty on the web: either
        # VITE_API_URL was set at build time, or the user set a server address and it is in
        # localStorage under 'alq:server-url' (src/mobile/serverUrl.js checks the stored value
        # before it checks for a native platform, so this reaches browsers too). The img-src
        # list above exists for exactly that configuration.
        #
        # The Android WebView rebases avatars the same way but is *not* the case this defends:
        # that document is served from https://localhost by Capacitor and carries no COEP of
        # ours, so nothing there is blocked either way. The header is still right for it.
        #
        # cross-origin, not same-site: same-site would cover app.example.com ← api.example.com
        # and would still block the WebView, whose origin shares no registrable domain with
        # the server. It also grants nothing new — with no CORP header at all, which is what
        # this location sent until now, any origin could already embed these images. The
        # containment for the real risk here (user-supplied files validated only by the
        # client's own Content-Type) is the sandbox CSP above, and it is unchanged.
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Model weights for the on-device transcriber and, later, the proposal model.
    #
    # Backed by the models_data volume, mounted read-only (docker-compose.yml) and filled by
    # the operator with `make models-fetch`. Deliberately *not* baked into the frontend image:
    # the Light-tier transcriber is 41 MB, the Full-tier model is ~2.6 GB, and an image layer
    # carrying either has to be rebuilt and re-pushed on every frontend change.
    #
    # An empty volume is the normal state on a fresh deployment. These 404 until the operator
    # runs the fetch, which is what the app's tier detection expects to find.
    location /models/ {
        alias /srv/models/;

        # =404 rather than falling through to the SPA. Without it a missing weight file would
        # be caught by `try_files ... /index.html` in `location /` and answered with HTTP 200
        # and a page of HTML, which arrives at the runtime as a corrupt model rather than as a
        # missing one. That exact confusion is what the /uploads/ block above was added to fix.
        try_files $uri =404;

        # A long lifetime is the point: these files are large, immutable for a given pinned
        # revision, and re-downloading 2.6 GB because a cache expired is the failure mode to
        # design against. Not `immutable`, though — the URL carries no content hash, so when
        # the operator re-pins a model in the Makefile the served bytes change while the path
        # does not, and `immutable` would refuse to revalidate even on an explicit reload.
        # With a plain max-age, nginx's ETag still makes a revalidation a 304.
        add_header Cache-Control "public, max-age=31536000" always;

        # Content-Length has to be exact, and gzip is what would take it away: a compressed
        # response switches to chunked transfer encoding and drops the header entirely. §5.6
        # requires every weight file to be fetched with a known length and verified against a
        # SHA-256 before it is cached, and a download manager that cannot show a total has no
        # progress bar to show either. gzip is off globally today; this makes the guarantee
        # local to the thing that depends on it. Range requests stay on (nginx serves static
        # files with Accept-Ranges: bytes), which is what makes a 2.6 GB fetch resumable.
        gzip off;

        # This location declares its own add_header, so nothing from the server level reaches
        # it — nginx replaces the inherited set rather than extending it. Restated below:
        # nosniff, because an .onnx is served as application/octet-stream and must stay that
        # way; and CORP, for the Android case, where the WebView document and this server are
        # different origins exactly as they are for /uploads/.
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Nothing dotted is ever meant to be served from the SPA root.
    location ~ /\. {
        deny all;
    }
}
