# Nginx is the only service with a published port, so it is the only door into the stack —
# which makes the limits set here the real limits, not advisory ones. That was not true while
# the backend was published on 8081 for anyone to route to directly.
#
# This file is included from the http block (conf.d/default.conf), so http-context directives
# belong at the top level here.

# Login and signup are the two endpoints where an attacker gets unlimited free attempts at
# someone's password. bcrypt at cost 14 already makes each one expensive — about a second of
# CPU — which is the other reason to bound them: fifty parallel guesses is also a way to take
# the backend down. 20/minute with a burst of 10 is far above what a person retrying a
# forgotten password does and far below what a script needs.
limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;
limit_req_status 429;

server {
    listen 80;
    server_name alexithymialovequantifier.voglerprojekte.com api.alexithymialovequantifier.voglerprojekte.com localhost _;

    # Do not volunteer the version to anyone deciding which exploit to try.
    server_tokens off;

    # Avatars are the only upload. Gin's own default multipart cap is 32 MB, and the
    # handler sets no limit of its own, so this is what stops a stranger from streaming
    # gigabytes into the backend's /tmp.
    client_max_body_size 8m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Docker's embedded DNS, consulted per request rather than once at startup.
    #
    # `proxy_pass http://backend:8080` resolves the name when the config loads and caches
    # that address for the life of the process, so recreating the backend container — which
    # gives it a new IP — leaves Nginx proxying to an address nothing answers on, and every
    # /api call 502s until Nginx is restarted too. Going through a variable forces runtime
    # resolution. $request_uri carries the original path and query string, which is what the
    # literal form passed implicitly.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $upstream http://backend:8080;

    # `always` so they are present on error responses too, which is where a missing
    # X-Content-Type-Options tends to matter.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # The built SPA loads one external script and one external stylesheet and nothing from
    # another origin (check dist/index.html — there are no inline scripts to allow for).
    # 'unsafe-inline' is needed for style-src only, for the handful of React style={{...}}
    # props; blob:/data: for the image preview before an avatar is uploaded.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://api.alexithymialovequantifier.voglerprojekte.com https://alexithymialovequantifier.voglerprojekte.com; font-src 'self'; connect-src 'self' https://api.alexithymialovequantifier.voglerprojekte.com https://alexithymialovequantifier.voglerprojekte.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Matches before the /api/ prefix block below — a regex location wins over a prefix one.
    #
    # `refresh` is here with the other two because it takes a credential from an unauthenticated
    # caller and answers with a live session: left in the generic /api/ block it would be the
    # one unmetered way to guess at one. 20r/m is far above what a real client needs — a token
    # is renewed roughly once a day, and only ever once per expiry.
    location ~ ^/api/(login|signup|refresh)$ {
        limit_req zone=auth burst=10 nodelay;

        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Previously absent, which is why avatars 404'd under Compose and the Android client was
    # pointed straight at the backend port instead. With this block the SPA and the app both
    # get their images through the proxy, and nothing needs a direct line to the backend.
    #
    # These files are user-supplied and the handler validates them by the Content-Type the
    # *client* declared (backend/internal/handlers/upload.go), so a file that is really HTML
    # can be stored and then served from this origin — stored XSS against the app's own
    # session. The headers below are the containment: `default-src 'none'` plus `sandbox`
    # means anything scriptable served from /uploads/ executes nothing and reaches nothing,
    # while an actual image still renders. add_header does not inherit into a location that
    # declares its own, so the server-level set is restated rather than extended.
    location /uploads/ {
        proxy_pass $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; script-src 'none'; sandbox; frame-ancestors 'none'" always;
    }

    # Nothing dotted is ever meant to be served from the SPA root.
    location ~ /\. {
        deny all;
    }
}
